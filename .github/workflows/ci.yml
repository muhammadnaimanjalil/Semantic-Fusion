name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Lint
        run: ruff check data_validation.py multimodal_pipeline.py streamlit_app.py tests

      - name: Compile
        run: python -m py_compile data_validation.py multimodal_pipeline.py streamlit_app.py

      - name: Test
        run: pytest -q
